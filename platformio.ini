; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = GPS module for mobile apps used to log lap times at a track circuit
extra_configs =
	platformio_custom.ini
; see platformio_custom.ini.template for an example to have your own definitions outside of version control

[env]
platform = espressif32
framework = arduino
lib_deps = 
	h2zero/NimBLE-Arduino @ ^2.3.2
	yiannisbourkelis/Uptime Library @ ^1.0.0
	evert-arias/EasyButton @ 2.0.1
	arkhipenko/TaskScheduler @ ^3.8.5
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder
build_flags = !python git_rev_macro.py
lib_ldf_mode = chain+

[env:esp32dev]
; basic configuration for a production build without logging
; OTA is disabled
board = esp32dev
monitor_port = /dev/cu.usbserial-0001
upload_port = /dev/cu.usbserial-0001
board_build.f_flash = 80000000L
build_flags = 
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DBUILD_ENV_NAME='"Prod build"'
	-DNO_GLOBAL_ARDUINOOTA

[env:esp32dev_ota]
; basic configuration for a production build without logging
; Update is OTA, OTA is enabled without timeout
board = esp32dev
upload_protocol = espota
upload_port = bonogps.local
board_build.f_flash = 80000000L
build_flags = 
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Prod build - OTA"'

[env:esp32dev_debug]
; basic configuration for a troublshooting/debug build without verbose logging
; OTA is enabled without timeout
board = esp32dev
monitor_port = /dev/cu.usbserial-0001
upload_port = /dev/cu.usbserial-0001
board_build.f_flash = 80000000L
build_type = debug
build_flags = 
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
	-DCORE_DEBUG_LEVEL=4
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Test build - OTA"'

[env:lolind32pro]
; lolind32 pro target with no logging
; not good for troubleshooting on serial as nothing is printed
; OTA is not enabled for standard value of 300 secs upon restart
board = lolin_d32_pro
board_build.f_flash = 80000000L
; board_build.flash_mode = qio
build_flags = 
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DNO_GLOBAL_ARDUINOOTA
	-DBUILD_ENV_NAME='"Prod build"'
;	-DBOARD_HAS_PSRAM
;    -mfix-esp32-psram-cache-issue

[env:lolind32pro_ota]
; lolind32 pro target with no logging
; not good for troubleshooting on serial as nothing is printed
; OTA is enabled forever
board = lolin_d32_pro
upload_protocol = espota
upload_port = bonogps.local
board_build.f_flash = 80000000L
build_flags = 
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Prod build - OTA"'

[env:lolind32pro_debug]
; lolind32 pro target with extended logging
; not good for real applications as log bogs down performances
; OTA is enabled forever
board = lolin_d32_pro
build_type = debug
board_build.f_flash = 80000000L
; board_build.flash_mode = qio
build_flags =
	${env.build_flags}
	-DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
	-DCORE_DEBUG_LEVEL=4
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Test build - OTA"'
;	-DBOARD_HAS_PSRAM
;    -mfix-esp32-psram-cache-issue

; Lilygo T-Energy-S3 (ESP32-S3-WROOM-1-R8, 16MB flash, 8MB Octal PSRAM)
; https://github.com/Xinyuan-LilyGO/T-Energy-S3
; There is no PlatformIO board definition specific to this board, so we use
; the generic Espressif S3 DevKitC-1 board and override flash/PSRAM settings.
; The T-Energy-S3 has no USB-serial bridge chip: the native USB CDC of the
; ESP32-S3 is used for Serial/flashing, which frees up UART0 on GPIO43/44 for
; a second hardware serial port (Serial2) - that's where the BK-880 GPS goes:
;   BK-880 TX -> GPIO44 (RX2)
;   BK-880 RX -> GPIO43 (TX2)
; There is no onboard status LED, so LED_BUILTIN is a harmless placeholder pin
; unless you wire an external LED - see bonogps_board_settings.h
[env:t_energy_s3]
; basic configuration for a production build without logging
; OTA is not enabled for standard value of 300 secs upon restart
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
	${env.build_flags}
	-DLILYGO_T_ENERGY_S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DNO_GLOBAL_ARDUINOOTA
	-DBUILD_ENV_NAME='"Prod build"'

[env:t_energy_s3_ota]
; same as above, but OTA is enabled forever
board = esp32-s3-devkitc-1
upload_protocol = espota
upload_port = bonogps.local
board_upload.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
	${env.build_flags}
	-DLILYGO_T_ENERGY_S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLOG_LOCAL_LEVEL=ESP_LOG_NONE
	-DCORE_DEBUG_LEVEL=0
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Prod build - OTA"'

[env:t_energy_s3_debug]
; troubleshooting/debug build with verbose logging over native USB CDC
; OTA is enabled forever
board = esp32-s3-devkitc-1
build_type = debug
board_upload.flash_size = 16MB
board_build.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
	${env.build_flags}
	-DLILYGO_T_ENERGY_S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
	-DCORE_DEBUG_LEVEL=4
	-DENABLE_OTA
	-DOTA_AVAILABILITY_SECS=-1
	-DBUILD_ENV_NAME='"Test build - OTA"'
